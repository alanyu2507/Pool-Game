<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Pool Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="garage"></div>
    <div class="instructions-box">
        <h2>Instructions</h2>
        <ul>
            <li>Drag click to rotate camera</li>
            <li>Shift + drag click to move camera</li>
            <li>Left/Right arrows rotate pool cue</li>
            <li>Up/Down arrows for precise rotation</li>
            <li>Press Enter to hit the ball</li>
        </ul>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
